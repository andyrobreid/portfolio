docs_dir: src
site_name: Andrew Reid
site_url: https://andyrobreid.github.io/portfolio/
repo_url: https://github.com/andyrobreid/portfolio/
plugins:
  - blog:
      blog_toc: true
theme:
  name: material
  logo: https://avatars.githubusercontent.com/u/39648091?v=4
  features:
    - navigation.tabs
    - navigation.tracking
markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tilde
